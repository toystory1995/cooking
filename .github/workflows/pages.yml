name: Website

# Rebuilt on every push to main, which includes the commit the Friday job makes
# to state/history.json -- so the site's progress bar is never stale.
on:
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "recipe_club/**"
      - "state/history.json"
      - "send_recipe.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy, but only ever run one at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the library parses
        run: python send_recipe.py validate

      - name: Build the site
        run: python send_recipe.py site --out site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
